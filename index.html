<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>手机警报器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #121419;
            color:#fff;
            padding:12px;
            max-width:520px;
            margin:0 auto;
            min-height:100vh;
            transition: background 0.07s;
        }
        body.flashR { background:#88161c; }
        body.flashB { background:#183088; }
        body.flashWhite { background:#eeeeee; }

        h1 {
            text-align:center;
            font-size:22px;
            margin-bottom:12px;
            color:#e2e2e2;
        }
        .status-bar {
            background:#1c2028;
            padding:10px 14px;
            border-radius:8px;
            margin-bottom:16px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .status-dot {
            width:12px;height:12px;
            border-radius:50%;
            background:#39d353;
        }
        .section-title {
            font-size:16px;
            color:#ffbc42;
            margin:18px 0 10px 4px;
            border-left:3px solid #ffbc42;
            padding-left:8px;
        }
        .btn-grid-row {
            display:grid;
            gap:10px;
            margin-bottom:8px;
        }
        .row-2 { grid-template-columns:1fr 1fr; }
        .row-3 { grid-template-columns:1fr 1fr 1fr; }
        .row-4 { grid-template-columns:1fr 1fr 1fr 1fr; }

        button {
            border:none;
            border-radius:8px;
            padding:18px 6px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            text-align:center;
            transition: all 0.12s ease;
        }
        button small {
            display:block;
            font-size:12px;
            opacity:0.8;
            font-weight:normal;
            margin-top:4px;
        }
        button:active { transform:scale(0.96); }

        .btn-red { background:#8b262c; color:#ff8888; }
        .btn-red.active { background:#c4303a; color:#fff; }
        .btn-green { background:#1c5238; color:#71e9aa; }
        .btn-green.active { background:#247c54; color:#fff; }
        .btn-orange { background:#704018; color:#ffbc60; }
        .btn-orange.active { background:#b8651c; color:#fff; }
        .btn-dark { background:#2c323f; color:#b4c2d8; }
        .btn-dark.active { background:#424c60; color:#fff; }
        .btn-purple { background:#402c58; color:#d0a8e8; }
        .btn-purple.active { background:#633e88; color:#fff; }
        .btn-mute { background:#742428; color:#ff8488; }

        .modal {
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            display:none;
            align-items:center;
            justify-content:center;
            padding:20px;
            z-index:999;
        }
        .modal-box{
            background:#222733;
            border-radius:12px;
            padding:24px;
            width:100%;
            max-width:400px;
        }
        .modal-close{
            width:100%;
            margin-top:16px;
            padding:12px;
            border-radius:8px;
            border:0;
            background:#3c4454;
            color:white;
            font-size:16px;
        }
    </style>
</head>
<body>
    <h1>手机警报器</h1>
    <div class="status-bar">
        <span class="status-dot"></span>
        <span>系统就绪</span>
    </div>

    <div class="section-title">号角与广播</div>
    <div class="btn-grid-row row-2">
        <button id="btnAirHorn" class="btn-red">气笛号角<small>点按触发</small></button>
        <button id="btnSpeaker" class="btn-green">车外广播<small>按住录音</small></button>
    </div>

    <div class="section-title">战术警灯</div>
    <div class="btn-grid-row row-4">
        <button id="btnAutoLink" class="btn-orange active">自动联动<small>随动</small></button>
        <button id="btnMode1" class="btn-orange">模式1<small>示宽</small></button>
        <button id="btnMode2" class="btn-orange">模式2<small>双爆</small></button>
        <button id="btnMode3" class="btn-orange">模式3<small>大循环</small></button>
    </div>
    <div class="btn-grid-row">
        <button id="btnStopCheck" class="btn-dark">拦停检车<small>前射灯</small></button>
    </div>

    <div class="section-title">手动电笛</div>
    <div class="btn-grid-row row-2">
        <button id="btnHighHorn" class="btn-orange">高音电笛<small>长按爬升 / 松开滑落</small></button>
        <button id="btnLowHorn" class="btn-orange">低音电笛<small>长按爬升 / 飞轮拖尾</small></button>
    </div>

    <div class="section-title">巡航警报</div>
    <div class="btn-grid-row row-3">
        <button id="btnWailStd" class="btn-dark">巡航 Wail<small>标准</small></button>
        <button id="btnWailSlow" class="btn-dark">慢速 Wail<small>慢速</small></button>
        <button id="btnWailFast" class="btn-dark">快速 Wail<small>快速</small></button>
    </div>

    <div class="section-title">急促警报</div>
    <div class="btn-grid-row row-3">
        <button id="btnYelp" class="btn-dark">急促 Yelp<small>急促</small></button>
        <button id="btnChase" class="btn-dark">追击变频<small>追击</small></button>
        <button id="btnPierce" class="btn-dark">极速穿透<small>极速</small></button>
    </div>

    <div class="section-title">特种与轮换</div>
    <div class="btn-grid-row row-3">
        <button id="btnVibrato" class="btn-dark">战术颤音<small>高频颤音</small></button>
        <button id="btnHiLo" class="btn-dark">救护 Hi‑Lo<small>救护双音</small></button>
        <button id="btnAutoCycle" class="btn-green">自动<small>随机轮换</small></button>
    </div>

    <div class="section-title">双音并发</div>
    <div class="btn-grid-row row-2">
        <button id="btnMixA" class="btn-purple">并发 A<small>巡航 + 急促</small></button>
        <button id="btnMixB" class="btn-purple">并发 B<small>急促 + 颤音</small></button>
    </div>

    <div class="section-title">系统控制</div>
    <div class="btn-grid-row row-4">
        <button id="btnBassPulse" class="btn-orange">重低音脉冲<small>点击开启</small></button>
        <button id="btnSetting" class="btn-dark">系统设置<small>调音设置</small></button>
        <button id="btnLowVol" class="btn-dark">低功率<small>-12dB</small></button>
        <button id="btnMuteAll" class="btn-mute">静音<small>一键全停</small></button>
    </div>

    <div class="modal" id="settingModal">
        <div class="modal-box">
            <h3>系统调音设置</h3>
            <p>音量、音调调节演示窗口</p>
            <button class="modal-close" onclick="closeModal()">关闭</button>
        </div>
    </div>

<script>
let audioCtx = null;
let masterGain = null;
let lowVolumeMode = false;
let autoCycleTimer = null;
let lightFlashTimer = null;
let activeOscList = [];
let hornOsc = null;
let hornGain = null;

//初始化音频
function initAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.22;
    masterGain.connect(audioCtx.destination);
}

//全部停止声音、灯光、定时器
function fullStop(){
    activeOscList.forEach(item=>{
        try{
            if(item.osc) item.osc.stop();
            if(item.timer) clearInterval(item.timer);
        }catch(e){}
    });
    activeOscList = [];

    if(hornOsc){ try{ hornOsc.stop(); }catch(e){} hornOsc=null; }
    hornGain=null;

    if(autoCycleTimer){ clearInterval(autoCycleTimer); autoCycleTimer=null; }
    if(lightFlashTimer){ clearInterval(lightFlashTimer); lightFlashTimer=null; }
    document.body.className = "";
}

//音量切换
function toggleLowVol(){
    lowVolumeMode = !lowVolumeMode;
    masterGain.gain.value = lowVolumeMode ? 0.08 : 0.22;
    document.getElementById("btnLowVol").classList.toggle("active", lowVolumeMode);
}

//灯光模式
function lightOff(){
    if(lightFlashTimer) clearInterval(lightFlashTimer);
    lightFlashTimer=null;
    document.body.className="";
}
function lightMode1(){
    lightOff();
    let flag = false;
    lightFlashTimer = setInterval(()=>{
        document.body.className = flag ? "flashR" : "";
        flag=!flag;
    },400);
}
function lightMode2(){
    lightOff();
    let f=false;
    lightFlashTimer = setInterval(()=>{
        document.body.className = f ? "flashR" : "flashB";
        f=!f;
    },180);
}
function lightMode3(){
    lightOff();
    const cls = ["","flashR","","flashB","","flashWhite"];
    let idx=0;
    lightFlashTimer = setInterval(()=>{
        document.body.className = cls[idx%cls.length];
        idx++;
    },220);
}
function lightSpot(){
    lightOff();
    document.body.className = "flashWhite";
    setTimeout(()=>{ document.body.className=""; }, 800);
}

//音效
function playAirHorn(){
    initAudio(); fullStop();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type="square";
    osc.frequency.value=330;
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.34, audioCtx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.42);
    osc.connect(g); g.connect(masterGain);
    osc.start(); osc.stop(audioCtx.currentTime+0.45);
}

function playWail(speed=1){
    initAudio(); fullStop();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type="sine";
    g.gain.value=0.32;
    osc.connect(g); g.connect(masterGain);
    const period = 1.4 / speed;
    function loop(){
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(1350, audioCtx.currentTime + period/2);
        osc.frequency.linearRampToValueAtTime(520, audioCtx.currentTime + period);
    }
    loop();
    const t = setInterval(loop, period*1000);
    osc.start();
    activeOscList.push({osc,timer:t});
}

function playYelp(){
    initAudio(); fullStop();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type="sine";
    g.gain.value=0.32;
    osc.connect(g); g.connect(masterGain);
    const period = 0.28;
    function tick(){
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(1400, audioCtx.currentTime + period/2);
        osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + period);
    }
    tick();
    const t = setInterval(tick, period*1000);
    osc.start();
    activeOscList.push({osc,timer:t});
}

function playHiLo(){
    initAudio(); fullStop();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type="sine";
    g.gain.value=0.32;
    osc.connect(g); g.connect(masterGain);
    let hi = true;
    const t = setInterval(()=>{
        osc.frequency.value = hi ? 880 : 660;
        hi = !hi;
    }, 420);
    osc.start();
    activeOscList.push({osc,timer:t});
}

function playVibrato(){
    initAudio(); fullStop();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type="sawtooth";
    g.gain.value=0.24;
    osc.connect(g); g.connect(masterGain);
    let f=900;
    const t = setInterval(()=>{
        f = f>1200 ? 700 : f+45;
        osc.frequency.value = f;
    },28);
    osc.start();
    activeOscList.push({osc,timer:t});
}

function playChase(){
    initAudio(); fullStop();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type="sine";
    g.gain.value=0.32;
    osc.connect(g); g.connect(masterGain);
    let spd=0.22;
    function chase(){
        osc.frequency.setValueAtTime(550, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(1450, audioCtx.currentTime+spd);
        osc.frequency.linearRampToValueAtTime(550, audioCtx.currentTime+spd*2);
    }
    chase();
    const timer = setInterval(()=>{
        spd = Math.max(0.08, spd-0.012);
        chase();
    }, spd*2*1000);
    osc.start();
    activeOscList.push({osc,timer});
}

function playPierce(){
    initAudio(); fullStop();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type="square";
    g.gain.value=0.18;
    osc.connect(g); g.connect(masterGain);
    const period = 0.11;
    function tick(){
        osc.frequency.setValueAtTime(750, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(1600, audioCtx.currentTime+period/2);
        osc.frequency.linearRampToValueAtTime(750, audioCtx.currentTime+period);
    }
    tick();
    const t = setInterval(tick, period*1000);
    osc.start();
    activeOscList.push({osc,timer:t});
}

function playBassPulse(){
    initAudio(); fullStop();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type="sine";
    g.gain.value=0.4;
    osc.connect(g); g.connect(masterGain);
    let volDown = false;
    const t = setInterval(()=>{
        g.gain.value = volDown ? 0.04 : 0.4;
        volDown = !volDown;
    },140);
    osc.frequency.value=75;
    osc.start();
    activeOscList.push({osc,timer:t});
}

//长按电笛
function startHorn(baseFreq, isFallOff){
    initAudio(); fullStop();
    hornOsc = audioCtx.createOscillator();
    hornGain = audioCtx.createGain();
    hornOsc.type="sawtooth";
    hornGain.gain.value=0.28;
    hornOsc.connect(hornGain); hornGain.connect(masterGain);
    let freq = baseFreq;
    hornOsc.frequency.value = freq;
    hornOsc.start();
    const rampTimer = setInterval(()=>{
        freq = Math.min(baseFreq*2.1, freq+12);
        hornOsc.frequency.value = freq;
    },35);
    hornOsc.rampTimer = rampTimer;
    hornOsc.isFall = isFallOff;
}
function stopHorn(){
    if(!hornOsc) return;
    clearInterval(hornOsc.rampTimer);
    if(hornOsc.isFall){
        const t = audioCtx.currentTime;
        hornOsc.frequency.linearRampToValueAtTime(220, t+0.32);
        hornGain.gain.exponentialRampToValueAtTime(0.001, t+0.38);
        setTimeout(()=>{ try{hornOsc.stop();}catch(e){} hornOsc=null; hornGain=null; },400);
    }else{
        const t = audioCtx.currentTime;
        hornGain.gain.exponentialRampToValueAtTime(0.001, t+0.25);
        setTimeout(()=>{ try{hornOsc.stop();}catch(e){} hornOsc=null; hornGain=null; },300);
    }
}

//双音并发
function playMixA(){
    initAudio(); fullStop();
    playWail(0.7);
    setTimeout(()=>playYelp(), 220);
}
function playMixB(){
    initAudio(); fullStop();
    playYelp();
    setTimeout(()=>playVibrato(),200);
}

//自动轮换
function toggleAutoCycle(){
    initAudio();
    if(autoCycleTimer){ fullStop(); return; }
    const list = [()=>playWail(1), ()=>playYelp(), ()=>playHiLo(), ()=>playVibrato()];
    autoCycleTimer = setInterval(()=>{
        const fn = list[Math.floor(Math.random()*list.length)];
        fn();
    },4500);
}

//弹窗
function openModal(){ document.getElementById("settingModal").style.display="flex"; }
function closeModal(){ document.getElementById("settingModal").style.display="none"; }

//绑定事件
document.querySelector("#btnAirHorn").onclick = playAirHorn;

//长按高低音电笛，兼容手机touch
const highBtn = document.querySelector("#btnHighHorn");
highBtn.addEventListener("touchstart",(e)=>{e.preventDefault();startHorn(420,true);});
highBtn.addEventListener("touchend",()=>stopHorn());
highBtn.addEventListener("mousedown",()=>startHorn(420,true));
highBtn.addEventListener("mouseup",()=>stopHorn());
highBtn.addEventListener("mouseleave",()=>stopHorn());

const lowBtn = document.querySelector("#btnLowHorn");
lowBtn.addEventListener("touchstart",(e)=>{e.preventDefault();startHorn(260,false);});
lowBtn.addEventListener("touchend",()=>stopHorn());
lowBtn.addEventListener("mousedown",()=>startHorn(260,false));
lowBtn.addEventListener("mouseup",()=>stopHorn());
lowBtn.addEventListener("mouseleave",()=>stopHorn());

document.querySelector("#btnWailStd").onclick = ()=>playWail(1);
document.querySelector("#btnWailSlow").onclick = ()=>playWail(0.55);
document.querySelector("#btnWailFast").onclick = ()=>playWail(1.7);
document.querySelector("#btnYelp").onclick = playYelp;
document.querySelector("#btnChase").onclick = playChase;
document.querySelector("#btnPierce").onclick = playPierce;
document.querySelector("#btnVibrato").onclick = playVibrato;
document.querySelector("#btnHiLo").onclick = playHiLo;
document.querySelector("#btnAutoCycle").onclick = toggleAutoCycle;
document.querySelector("#btnMixA").onclick = playMixA;
document.querySelector("#btnMixB").onclick = playMixB;
document.querySelector("#btnBassPulse").onclick = playBassPulse;
document.querySelector("#btnLowVol").onclick = toggleLowVol;
document.querySelector("#btnMuteAll").onclick = fullStop;
document.querySelector("#btnSetting").onclick = openModal;

//灯光按钮
const lightIds = ["btnAutoLink","btnMode1","btnMode2","btnMode3","btnStopCheck"];
lightIds.forEach((id)=>{
    const el = document.getElementById(id);
    el.onclick = function(){
        lightIds.forEach(bid=>document.getElementById(bid).classList.remove("active"));
        this.classList.add("active");
        if(id === "btnAutoLink") lightOff();
        if(id === "btnMode1") lightMode1();
        if(id === "btnMode2") lightMode2();
        if(id === "btnMode3") lightMode3();
        if(id === "btnStopCheck") lightSpot();
    }
})

//车外广播，需要HTTPS环境(GitHub Pages可用，本地文件不行)
const speakerBtn = document.querySelector("#btnSpeaker");
speakerBtn.addEventListener("touchstart", async (e)=>{
    e.preventDefault();
    try{
        await navigator.mediaDevices.getUserMedia({audio:true});
        alert("麦克风已获取，广播功能需要后端音频输出转发，前端仅获取麦克风成功。");
    }catch(err){
        alert("⚠️ 麦克风失败：本地文件打开不支持麦克风，请部署到GitHub Pages(HTTPS)");
    }
});
</script>
</body>
</html>
