<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- iPhone全屏强制适配，禁止缩放，适配刘海屏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>老人机</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* ==========老年机整机外壳 立体感机身========== */
        .old-phone-shell {
            width: 86vw;
            max-width: 420px;
            height: 94vh;
            background: linear-gradient(145deg,#303030,#1c1c1c);
            border-radius: 32px;
            padding: 20px 16px;
            /* 多层外阴影模拟实体机身厚度 */
            box-shadow: 
                inset 2px 2px 4px #444444,
                inset -3px -3px 6px #0a0a0a,
                0 0 0 4px #000,
                0 12px 35px #000000;
            border:1px solid #444;
            display: flex;
            flex-direction: column;
        }
        /* LCD显示屏容器（玻璃边框） */
        .lcd-frame {
            background-color:#080808;
            border-radius:12px;
            padding:10px;
            box-shadow: inset 0 0 12px #000;
            margin-bottom:16px;
        }
        /* LCD绿屏屏幕区域，支持触屏点击 */
        .lcd-screen {
            width:100%;
            flex:1;
            min-height:34vh;
            background-color:#b6c88a;
            border-radius:6px;
            padding:10px 8px;
            color:#0c1c00;
            font-size:18px;
            line-height:1.7;
            overflow:hidden;
            position:relative;
            /* 模拟屏幕玻璃反光 */
            background-image: linear-gradient(105deg, rgba(255,255,255,0.08) 0%, transparent 40%);
        }
        .boot-txt{
            text-align:center;
            margin-top:11vh;
            display:none;
            font-weight:500;
        }
        .main-menu-view{
            display:none;
        }
        .contact-view{
            display:none;
        }
        /* 屏幕内菜单【支持触屏点击】 */
        .menu-item{
            padding:5px 6px;
            margin:4px 0;
            cursor:pointer;
            border-radius:3px;
        }
        .menu-item.active{
            background:#829855;
        }
        .contact-item{
            padding:5px 6px;
            margin:3px 0;
            cursor:pointer;
            border-radius:3px;
        }
        .contact-item.active{
            background:#829855;
        }

        /* ==========按键通用样式 按压动画========== */
        .key{
            border:none;
            cursor:pointer;
            transition: transform 0.1s ease, filter 0.1s;
            border-radius:8px;
        }
        .key:active{
            transform:scale(0.93);
            filter:brightness(0.75);
        }
        /* 顶部开机电源键 */
        .power-key{
            width:100%;
            padding:13px;
            margin-bottom:16px;
            font-size:18px;
            background:linear-gradient(145deg,#505050,#292929);
            color:#fff;
            box-shadow: 0 4px 0 #181818;
        }
        /* 十字导航区域 */
        .nav-keypad{
            display:grid;
            grid-template-columns: 48px 54px 48px;
            grid-template-rows: 42px 42px 42px;
            gap:5px;
            justify-content:center;
            margin-bottom:14px;
        }
        .nav-dir{
            background:linear-gradient(145deg,#444,#2a2a2a);
            color:#fff;
            font-size:18px;
        }
        .nav-ok{
            background:linear-gradient(145deg,#992828,#591616);
            color:#fff;
            font-weight:bold;
        }
        /* T9数字按键区 */
        .num-keypad{
            display:grid;
            grid-template-columns: repeat(3, 1fr);
            gap:7px;
        }
        .num-key{
            padding:12px 0;
            background:linear-gradient(145deg,#3c3c3c,#222222);
            color:#fff;
            font-size:19px;
        }
    </style>
</head>
<body>
<div class="old-phone-shell">
    <!-- 开机电源按键 -->
    <button class="key power-key" id="powerBtn">【 开机 】</button>

    <!-- LCD屏幕带玻璃外框 -->
    <div class="lcd-frame">
        <div class="lcd-screen" id="screenBox">
            <div class="boot-txt" id="bootText">正在开机...</div>
            <!-- 主菜单界面 -->
            <div class="main-menu-view" id="mainMenu">
                <div class="menu-item" data-voice="电话本">☎ 电话本</div>
                <div class="menu-item" data-goto="contact">通讯录</div>
                <div class="menu-item" data-voice="短信息">✉ 短信息</div>
                <div class="menu-item" data-voice="通话记录">📞 通话记录</div>
                <div class="menu-item" data-voice="设置">⚙ 设置</div>
            </div>
            <!-- 通讯录界面 -->
            <div class="contact-view" id="contactPage">
                <div class="contact-item" data-voice="熊大">熊大</div>
                <div class="contact-item" data-voice="熊二">熊二</div>
                <div class="contact-item" data-voice="光头强">光头强</div>
                <div class="contact-item" data-voice="赛罗奥特曼">赛罗奥特曼</div>
                <div class="contact-item" data-voice="大姐董明珠">大姐董明珠</div>
                <div class="contact-item" data-voice="大哥刘华强">大哥刘华强</div>
                <div class="contact-item" data-voice="邵帅张学良">邵帅张学良</div>
                <div class="contact-item" data-voice="省委沙瑞金">省委沙瑞金</div>
                <div class="contact-item" data-voice="首富马斯克">首富马斯克</div>
                <div class="contact-item" data-voice="天王牛得华">天王牛得华</div>
                <div class="contact-item" data-voice="西天如来佛">西天如来佛</div>
                <div class="contact-item" data-call="mayun">马云邀请您视频通话</div>
                <div class="contact-item" data-back="true">← 返回菜单</div>
            </div>
        </div>
    </div>

    <!-- 十字导航按键 -->
    <div class="nav-keypad">
        <div></div>
        <button class="key nav-dir" id="navUp">↑</button>
        <div></div>
        <button class="key nav-dir" id="navLeft">←</button>
        <button class="key nav-dir nav-ok" id="navOk">确认</button>
        <button class="key nav-dir" id="navRight">→</button>
        <div></div>
        <button class="key nav-dir" id="navDown">↓</button>
        <div></div>
    </div>

    <!-- 数字T9按键 -->
    <div class="num-keypad">
        <button class="key num-key">1</button>
        <button class="key num-key">2</button>
        <button class="key num-key">3</button>
        <button class="key num-key">4</button>
        <button class="key num-key">5</button>
        <button class="key num-key">6</button>
        <button class="key num-key">7</button>
        <button class="key num-key">8</button>
        <button class="key num-key">9</button>
        <button class="key num-key">*</button>
        <button class="key num-key">0</button>
        <button class="key num-key">#</button>
    </div>
</div>

<!-- 音频文件 同级目录 -->
<audio id="bootMusic" preload="auto">
    <source src="./bingtanghulu.mp3" type="audio/mpeg">

<audio id="ringMayun" preload="auto">
    <source src="./mayun_call.mp3" type="audio/mpeg">


<script>
    //全局变量
    const bootMusic = document.getElementById("bootMusic");
    const ringMayun = document.getElementById("ringMayun");
    const bootText = document.getElementById("bootText");
    const mainMenu = document.getElementById("mainMenu");
    const contactPage = document.getElementById("contactPage");
    const powerBtn = document.getElementById("powerBtn");

    let poweredOn = false;
    let currentPage = "boot";
    let selectIndex = 0;
    let currentList = [];

    //开机逻辑
    powerBtn.onclick = function(){
        if(poweredOn) return;
        poweredOn = true;
        currentPage = "boot";
        bootText.style.display = "block";

        bootMusic.currentTime = 0;
        bootMusic.volume = 1;
        bootMusic.play();
        setTimeout(()=> bootMusic.pause(),10000);

        setTimeout(()=>{
            bootText.style.display = "none";
            mainMenu.style.display = "block";
            currentPage = "mainmenu";
            currentList = Array.from(mainMenu.querySelectorAll(".menu-item"));
            selectIndex = 0;
            refreshCursor();
            speakText("手机开机成功");
        },1800);
    }

    //刷新选中高亮
    function refreshCursor(){
        currentList.forEach((item,i)=>{
            item.classList.toggle("active", i === selectIndex);
        })
    }

    //上下导航切换选中
    document.getElementById("navUp").onclick = ()=>{
        if(!poweredOn || currentPage === "boot") return;
        selectIndex = selectIndex - 1;
        if(selectIndex < 0) selectIndex = currentList.length - 1;
        refreshCursor();
    }
    document.getElementById("navDown").onclick = ()=>{
        if(!poweredOn || currentPage === "boot") return;
        selectIndex = selectIndex + 1;
        if(selectIndex >= currentList.length) selectIndex = 0;
        refreshCursor();
    }

    //确认按键执行功能
    function executeItemAction(item){
        const voiceTxt = item.dataset.voice;
        const gotoPage = item.dataset.goto;
        const callEvent = item.dataset.call;
        const backFlag = item.dataset.back;

        if(backFlag){
            contactPage.style.display="none";
            mainMenu.style.display="block";
            currentPage="mainmenu";
            currentList=Array.from(mainMenu.querySelectorAll(".menu-item"));
            selectIndex=0;
            refreshCursor();
            speakText("返回主菜单");
            return;
        }
        if(gotoPage === "contact"){
            mainMenu.style.display="none";
            contactPage.style.display="block";
            currentPage="contact";
            currentList=Array.from(contactPage.querySelectorAll(".contact-item"));
            selectIndex=0;
            refreshCursor();
            speakText("通讯录");
            return;
        }
        if(callEvent === "mayun"){
            speakText("马云邀请您视频通话");
            ringMayun.currentTime=0;
            ringMayun.play();
            return;
        }
        if(voiceTxt){
            speakText(voiceTxt);
        }
    }
    document.getElementById("navOk").onclick = function(){
        if(!poweredOn || currentPage==="boot") return;
        executeItemAction(currentList[selectIndex]);
    }

    // =====【触屏支持】屏幕菜单直接点击 =====
    document.querySelectorAll(".menu-item, .contact-item").forEach(item=>{
        item.onclick = function(){
            if(!poweredOn || currentPage === "boot") return;
            //点击直接执行功能
            const idx = currentList.indexOf(this);
            if(idx >=0) selectIndex = idx;
            refreshCursor();
            executeItemAction(this);
        }
    })

    //老人机机械语音播报 语速调整为1.0标准速度
    function speakText(text){
        window.speechSynthesis.cancel();
        let voiceObj = new SpeechSynthesisUtterance(text);
        voiceObj.lang = "zh-CN";
        voiceObj.rate = 1.0;
        voiceObj.pitch = 0.7;
        voiceObj.volume = 1;
        const voices = window.speechSynthesis.getVoices();
        for(let v of voices){
            if((v.name.includes("男声")||v.name.includes("Kangkang")||v.name.includes("普通话")) && v.lang.startsWith("zh")){
                voiceObj.voice = v;
                break;
            }
        }
        window.speechSynthesis.speak(voiceObj);
    }
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
</script>
</body>
</html>
